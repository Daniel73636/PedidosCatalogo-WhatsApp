services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
      POSTGRES_DB: pedidos
    ports: ["5432:5432"]
    volumes: [pedidos_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [pedidos_redis:/data]
  api:
    build: .
    command: ["node", "apps/api/dist/server.js"]
    environment:
      DATABASE_URL: postgres://pedidos:pedidos@postgres:5432/pedidos
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      ADMIN_API_KEY: demo-admin-key
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    build: .
    command: ["pnpm", "--filter", "@pedidos/web", "start"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_DEMO_ADMIN_KEY: demo-admin-key
    ports: ["3000:3000"]
    depends_on: [api]
  worker:
    build: .
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      DATABASE_URL: postgres://pedidos:pedidos@postgres:5432/pedidos
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
volumes:
  pedidos_pg:
  pedidos_redis:
